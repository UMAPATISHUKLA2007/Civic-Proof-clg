<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiviProof | My Reports</title>
    
    <!-- Navbar ki CSS link -->
    <link rel="stylesheet" href="navbar.css">

    <!-- My Reports ke liye Direct CSS taaki colors aur styles 100% load hon -->
    <style>
        .reports-container {
            width: calc(100% - 40px);
            max-width: 1200px;
            margin: 45px auto 65px;
        }

        .reports-header-section {
            margin-bottom: 35px;
        }

        .reports-title-wrap {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .reports-icon-box {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf6ff;
            border: 1px solid #d3e8ff;
            border-radius: 20px;
            color: #0875ed;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(8, 117, 237, 0.08);
        }

        .reports-title-wrap h2 {
            color: #0b1e4b;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .reports-desc {
            max-width: 650px;
            margin-top: 14px;
            color: #71809b;
            font-size: clamp(13px, 1.5vw, 16px);
            line-height: 1.7;
        }

        /* Filter Tabs Row */
        .filter-tabs-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-tab-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            min-height: 50px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #dce8f8;
            border-radius: 16px;
            color: #61708e;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(25, 80, 135, 0.05);
            transition: all 0.25s ease;
        }

        .filter-tab-btn:hover {
            color: #0875ed;
            background: #edf5ff;
            border-color: #b9d8fa;
            transform: translateY(-2px);
        }

        .filter-tab-btn.active {
            color: #0875ed;
            background: #eaf3ff;
            border-color: #0875ed;
            box-shadow: 0 8px 22px rgba(8, 117, 237, 0.18);
        }

        .tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            background: #edf5ff;
            color: #0875ed;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 900;
        }

        .filter-tab-btn.active .tab-badge {
            background: #0875ed;
            color: #ffffff;
        }

        /* Reports History List & Empty State */
        .reports-history-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .empty-history-box {
            min-height: 275px;
            padding: 45px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #eaf5ff, #f8fbff);
            border: 1px solid #cfe4fa;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(30, 90, 150, 0.08);
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf6ff;
            border: 1px solid #d3e8ff;
            border-radius: 20px;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(8, 117, 237, 0.08);
        }

        .empty-history-box h3 {
            margin-top: 18px;
            color: #10275a;
            font-size: clamp(20px, 2.5vw, 24px);
            font-weight: 800;
        }

        .empty-history-box p {
            max-width: 650px;
            margin-top: 8px;
            color: #687995;
            font-size: 13px;
            line-height: 1.7;
        }

        /* Dynamic Report Card Style */
        .report-history-card {
            position: relative;
            padding: 30px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #dce8f8;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(25, 80, 135, 0.07);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .report-history-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0875ed, #4cb6ff);
        }

        .report-history-card:hover {
            transform: translateY(-7px);
            border-color: #b9d8fa;
            box-shadow: 0 18px 40px rgba(25, 80, 135, 0.13);
        }

        .report-info-col {
            flex: 2;
            min-width: 0;
        }

        .report-info-col h3 {
            color: #10275a;
            font-size: clamp(17px, 1.7vw, 20px);
            font-weight: 800;
            line-height: 1.3;
        }

        .report-info-col p {
            margin-top: 8px;
            color: #71809a;
            font-size: 13px;
            line-height: 1.6;
        }

        .report-status-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .status-pill {
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .status-pill.resolved {
            color: #16b87a;
            background: #e1fbf0;
        }

        .status-pill.in-progress {
            color: #0875ed;
            background: #edf5ff;
        }

        .status-pill.submitted {
            color: #d97706;
            background: #fef3c7;
        }

        .status-pill.closed {
            color: #64748b;
            background: #f1f5f9;
        }

        .report-id-text {
            color: #8492ab;
            font-size: 11px;
            font-weight: 700;
        }

        .report-action-col {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .report-action-col button {
            min-height: 52px;
            padding: 10px 22px;
            color: white;
            background: linear-gradient(135deg, #0879f5, #075ed4);
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(8, 117, 237, 0.22);
            transition: all 0.25s ease;
        }

        .report-action-col button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(8, 117, 237, 0.30);
        }

        @media (max-width: 700px) {
            .reports-container {
                width: calc(100% - 24px);
            }
            .report-history-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
                padding: 22px;
            }
            .report-action-col {
                width: 100%;
                justify-content: flex-start;
            }
            .report-action-col button {
                width: 100%;
            }
        }

        @media (max-width: 550px) {
            .filter-tabs-row {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .filter-tab-btn {
                width: 100%;
                justify-content: center;
                padding: 10px 12px;
            }
        }
    </style>
</head>

<>

    <!-- MAIN CONTENT — MY REPORTS -->
    <main>
        <section class="reports-container">
            
            <!-- Section Header -->
            <div class="reports-header-section">
                <div class="reports-title-wrap">
                    <div class="reports-icon-box">▤</div>
                    <h2>MY REPORTS</h2>
                </div>
                <p class="reports-desc">
                    Here are all the complaints you have reported. Track their progress history.
                </p>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs-row">
                <button class="filter-tab-btn active">All <span class="tab-badge">0</span></button>
                <button class="filter-tab-btn">Submitted <span class="tab-badge">0</span></button>
                <button class="filter-tab-btn">In Progress <span class="tab-badge">0</span></button>
                <button class="filter-tab-btn">Resolved <span class="tab-badge">0</span></button>
                <button class="filter-tab-btn">Closed <span class="tab-badge">0</span></button>
            </div>

            <!-- Dynamic History List Container -->
            <div id="reportsHistoryContainer" class="reports-history-list">
                
                <!-- Default Empty State -->
                <div class="empty-history-box">
                    <div class="empty-icon">📂</div>
                    <h3>No Reports Found</h3>
                    <p>Aapne abhi tak koi report submit nahi ki hai.</p>
                </div>

            </div>

        </section>
    </main>
<script src="myreports.js"></script>

</body>

</html>
